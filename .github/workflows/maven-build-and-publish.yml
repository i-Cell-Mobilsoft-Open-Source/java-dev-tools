name: Build & publish

on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: maven

    - name: Import GPG key
      run: |
        mkdir -p ~/.gnupg/
        echo "${{ secrets.GPG_SIGNING_KEY_GITHUB_TECHUSER }}" | base64 --decode > ~/.gnupg/private.key
        gpg --import ~/.gnupg/private.key

    - name: Build & Publish to Maven Central
      run: mvn deploy -B -s $GITHUB_WORKSPACE/.github/.m2/settings.xml -Prelease
      env:
        USERNAME: '${{ secrets.CENTRAL_SONATYPE_ORG_USER }}'
        PASSWORD: '${{ secrets.CENTRAL_SONATYPE_ORG_PASSWORD }}'
        GPG_KEYNAME: '${{ secrets.GPG_KEY_ID_GITHUB_TECHUSER }}'
